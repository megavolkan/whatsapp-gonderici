name: Derleme ve Sürüm

# package.json'daki sürüm için henüz bir etiket yoksa (ör. 0.1.1 → v0.1.1),
# ana dala yapılan gönderimde macOS ve Windows paketleri derlenir, etiket oluşturulur
# ve paketler bir sürüm olarak yayınlanır. Sürüm değişmeyen gönderimlerde hiçbir şey
# derlenmez (repo private; macOS dakikaları 10× sayılıyor).
# Yeni sürüm yayınlamak için package.json'daki "version" alanını artırmak yeterlidir.
# Elle çalıştırma (workflow_dispatch) yalnızca deneme derlemesi yapar, yayınlamaz.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Sürüm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mevcut etiketleri görmek için
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] \
             && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version yayınlanacak"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version zaten var ya da ana dal değil; yalnızca derleme"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # postinstall'daki patch-package, dmg-builder ve whatsapp-web.js yamalarını uygular.
      - name: Bağımlılıkları kur
        run: npm ci

      # --publish never: electron-builder'ın kendi başına GitHub'a yüklemesini engeller;
      # yayınlama aşağıdaki release işinde yapılır.
      - name: Paketle
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: paketler
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WhatsApp Gönderici ${{ needs.version.outputs.version }}
          files: paketler/*
          generate_release_notes: true
